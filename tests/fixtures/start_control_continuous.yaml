# Continuous start control on the host platform: a smoke test of the wiring.
# The head runs the regular PID path (powered on at the target, Control state 4)
# until the supervisor says a higher-ranked head runs. Start control then
# engages and parks it at once past shared_off_threshold (0.4), not the
# hysteresis off_threshold (0.75). Once the hint is cleared for
# min_cycle_duration it is released: a parked head stays off until the regular
# hysteresis switches it on at on_threshold.
#
#   uv run --locked esphome compile tests/fixtures/start_control_continuous.yaml
#   tests/fixtures/.esphome/build/start-control-continuous/.pioenvs/start-control-continuous/program
esphome:
  name: start-control-continuous
  on_boot:
    priority: -200
    then:
      - delay: 3s
      - logger.log: "STEP 1: user selects HEAT 21 with the room at 20.6 -> device on at the target, continuous (state 4)"
      - climate.control:
          id: outer
          mode: HEAT
          target_temperature: 21
      - delay: 8s
      - logger.log: "STEP 2: no hint, room 21.5 (inside the 0.75 band) -> stays powered, continuous"
      - globals.set:
          id: room
          value: "21.5"
      - delay: 8s
      - logger.log: "STEP 3: hint on, room 21.5 (past shared_off_threshold 0.4) -> engaged, parked at once"
      - lambda: id(outer).set_shared_heat_hint(true, 120);
      - delay: 8s
      - logger.log: "STEP 4: hint off, room 20.9 -> released after min_cycle_duration, stays off"
      - lambda: id(outer).set_shared_heat_hint(false, 120);
      - globals.set:
          id: room
          value: "20.9"
      - delay: 10s
      - logger.log: "STEP 5: room 20.7 (past on_threshold 0.25) -> hysteresis switches it on, continuous"
      - globals.set:
          id: room
          value: "20.7"
      - delay: 8s
      - logger.log: "SCENARIO DONE"

host:

logger:
  level: DEBUG

external_components:
  - source: ../../components

globals:
  - id: room
    type: float
    initial_value: "20.6"

demo:
  climates:
    - id: inner_climate
      name: "Inner climate"
      type: 2

sensor:
  - platform: template
    id: room_temperature
    name: "Room temperature"
    unit_of_measurement: "°C"
    update_interval: 1s
    lambda: return id(room);

climate:
  - platform: climate_adaptivepid
    id: outer
    name: "Outer climate"
    climate_id: inner_climate
    temperature_sensor: room_temperature
    update_interval: 1s
    settle_time: 2s
    pid:
      kp: 1.0
      ki: 0.0
      max_adjustment_under: 1.0
      max_adjustment_over: 0.5
      start_control: continuous
    hysteresis:
      on_threshold: 0.25
      off_threshold: 0.75
      shared_off_threshold: 0.4
      off_delay: 10s
      min_cycle_duration: 4s
