# Start control on the host platform: a smoke test of the wiring (power-on
# idle, staying powered on shared heat inside the hysteresis band, parking at
# once past off_threshold on shared heat, unparking at on_threshold, and the
# hysteresis cut after off_delay without shared heat). The demo climate does not
# behave like a Mitsubishi thermostat, so start and stop timing are covered by
# the native tests, not here.
#
#   uv run --locked esphome compile tests/fixtures/start_control.yaml
#   tests/fixtures/.esphome/build/start-control-scenario/.pioenvs/start-control-scenario/program
esphome:
  name: start-control-scenario
  on_boot:
    priority: -200
    then:
      - delay: 3s
      - logger.log: "STEP 1: user selects HEAT 21 with the room at 20.6 -> device on at the idle setpoint"
      - climate.control:
          id: outer
          mode: HEAT
          target_temperature: 21
      - delay: 8s
      - logger.log: "STEP 2: shared heat, room 21.4 (inside the band) -> stays powered, IDLE"
      - lambda: id(outer).set_shared_heat_hint(true, 120);
      - globals.set:
          id: room
          value: "21.4"
      - delay: 8s
      - logger.log: "STEP 3: shared heat, room 21.6 (past off_threshold 0.5) -> parked at once, PARKED"
      - globals.set:
          id: room
          value: "21.6"
      - delay: 8s
      - logger.log: "STEP 4: no shared heat, room 20.9 (inside the band) -> stays off"
      - lambda: id(outer).set_shared_heat_hint(false, 120);
      - globals.set:
          id: room
          value: "20.9"
      - delay: 8s
      - logger.log: "STEP 5: room 20.7 (past on_threshold 0.25) -> unparked, IDLE"
      - globals.set:
          id: room
          value: "20.7"
      - delay: 8s
      - logger.log: "STEP 6: no shared heat, room 21.6 -> hysteresis holds for off_delay (10s), then cuts, PARKED"
      - globals.set:
          id: room
          value: "21.6"
      - delay: 16s
      - logger.log: "SCENARIO DONE"

host:

logger:
  level: DEBUG

external_components:
  - source: ../../components

globals:
  - id: room
    type: float
    initial_value: "20.6"

demo:
  climates:
    - id: inner_climate
      name: "Inner climate"
      type: 2

sensor:
  - platform: template
    id: room_temperature
    name: "Room temperature"
    unit_of_measurement: "°C"
    update_interval: 1s
    lambda: return id(room);

climate:
  - platform: climate_adaptivepid
    id: outer
    name: "Outer climate"
    climate_id: inner_climate
    temperature_sensor: room_temperature
    update_interval: 1s
    settle_time: 2s
    pid:
      kp: 1.0
      ki: 0.0
      max_adjustment_over: 1.0
      start_control: true
      start_threshold: 0.5
    hysteresis:
      on_threshold: 0.25
      off_threshold: 0.5
      off_delay: 10s
      min_cycle_duration: 4s
