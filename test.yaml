esphome:
  name: test-device

host:

logger:
  level: DEBUG

api:
  actions:
    - action: reset_tuning
      then:
        - lambda: id(test_heatpump).reset_tuning();

external_components:
  - source: components

# Any single-target climate can be wrapped. The demo climate stands in for the
# real device here; see README.md for the Mitsubishi CN105 configuration.
demo:
  climates:
    - id: inner_climate
      name: "Inner climate"
      type: 1
      internal: true
      visual:
        temperature_step:
          target_temperature: 0.5
          current_temperature: 0.1

sensor:
  - platform: template
    id: room_temperature
    name: "Room temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    update_interval: 10s
    lambda: return 21.0;

  - platform: template
    id: outdoor_temperature
    name: "Outdoor temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    update_interval: 60s
    lambda: return 5.0;

climate:
  - platform: workflow_climate
    id: test_heatpump
    name: "Test Heatpump"
    climate_id: inner_climate
    temperature_sensor: room_temperature
    outdoor_temperature_sensor: outdoor_temperature
    update_interval: 2s
    visual:
      min_temperature: 16
      max_temperature: 31
    pid:
      kp: 1.5
      ki: 0.015
      kd: 0.0
      max_adjustment_under: 2.0
      max_adjustment_over: 2.0
      initial_heat_rate: 2.5
      initial_cool_rate: 1.5
    hysteresis:
      on_threshold: 0.25
      off_threshold: 0.5
      min_cycle_duration: 60s
